name: GST Android 64-bit Release to artifacts .so

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug/release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GStreamerVersion: 1.26.6

jobs:
  Android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Download and Extract GStreamer
        run: |
          wget https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GStreamerVersion }}/gstreamer-1.0-android-universal-${{ env.GStreamerVersion }}.tar.xz
          mkdir gstreamer_android
          tar -xf gstreamer-1.0-android-universal-${{ env.GStreamerVersion }}.tar.xz -C gstreamer_android/
          
          echo "=== GStreamer extracted structure: ==="
          ls -la gstreamer_android/
          
          # Check if the expected directory exists
          if [ -d "gstreamer_android/arm64" ]; then
            echo "Found arm64 directory"
            ls -la gstreamer_android/arm64/share/gst-android/ndk-build/ || echo "ndk-build directory not found"
          elif [ -d "gstreamer_android/armv8" ]; then
            echo "Found armv8 directory"
            ls -la gstreamer_android/armv8/share/gst-android/ndk-build/ || echo "ndk-build directory not found"
          fi

      - name: Create NDK Project Structure
        run: |
          mkdir -p jni
          
          # Determine the correct architecture folder name
          if [ -d "gstreamer_android/arm64" ]; then
            GST_ARCH_DIR="arm64"
          elif [ -d "gstreamer_android/armv8" ]; then
            GST_ARCH_DIR="armv8"
          else
            echo "ERROR: Could not find arm64 or armv8 directory"
            exit 1
          fi
          
          echo "Using GStreamer architecture directory: $GST_ARCH_DIR"
          
          # Application.mk
          echo "APP_ABI := ${{ matrix.abi }}" > jni/Application.mk
          echo "APP_PLATFORM := android-21" >> jni/Application.mk
          echo "APP_STL := c++_shared" >> jni/Application.mk
          
          # Android.mk
          cat > jni/Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          
          LOCAL_MODULE := gstreamer_android
          
          # Point to the architecture-specific GStreamer directory
          GSTREAMER_NDK_BUILD_PATH := $(GSTREAMER_ROOT_ANDROID)/share/gst-android/ndk-build
          include $(GSTREAMER_NDK_BUILD_PATH)/gstreamer-1.0.mk
          EOF
          
          echo "=== Android.mk contents: ==="
          cat jni/Android.mk
          echo "=== Application.mk contents: ==="
          cat jni/Application.mk

      - name: Build GStreamer Combined Library
        run: |
          # Determine the correct architecture folder
          if [ -d "gstreamer_android/arm64" ]; then
            GST_ARCH_DIR="arm64"
          elif [ -d "gstreamer_android/armv8" ]; then
            GST_ARCH_DIR="armv8"
          else
            echo "ERROR: Could not find arm64 or armv8 directory"
            exit 1
          fi
          
          # Set both GSTREAMER_ROOT and GSTREAMER_ROOT_ANDROID
          export GSTREAMER_ROOT=${{ github.workspace }}/gstreamer_android/$GST_ARCH_DIR
          export GSTREAMER_ROOT_ANDROID=${{ github.workspace }}/gstreamer_android/$GST_ARCH_DIR
          
          # Define which GStreamer plugins to include (customize as needed)
          export GSTREAMER_PLUGINS="coreelements app audioconvert audioresample audioparsers playback typefindfunctions"
          
          echo "GSTREAMER_ROOT is set to: ${GSTREAMER_ROOT}"
          echo "GSTREAMER_ROOT_ANDROID is set to: ${GSTREAMER_ROOT_ANDROID}"
          echo "GSTREAMER_PLUGINS is set to: ${GSTREAMER_PLUGINS}"
          
          # Verify the gstreamer-1.0.mk file exists
          if [ -f "${GSTREAMER_ROOT}/share/gst-android/ndk-build/gstreamer-1.0.mk" ]; then
            echo "✓ Found gstreamer-1.0.mk"
          else
            echo "✗ ERROR: gstreamer-1.0.mk not found at expected location"
            exit 1
          fi
          
          echo "=== Building libgstreamer_android.so for ${{ matrix.abi }} ==="
          ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=./jni/Application.mk V=1
          
          echo "=== Build complete. Listing output files: ==="
          ls -lR libs/ || echo "libs directory not found"
          ls -l libs/${{ matrix.abi }}/ || echo "${{ matrix.abi }} directory not found"
          
      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp libs/${{ matrix.abi }}/libgstreamer_android.so artifacts/
          cp ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so artifacts/
          
          echo "=== Artifacts prepared: ==="
          ls -l artifacts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGStreamer-${{ matrix.abi }}
          path: artifacts/*.so

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*.so"
          token: ${{ secrets.GITHUB_TOKEN }}

name: GST Android 64-bit Release to artifacts .so

on:
  push:
    tags:
      - 'v*' # Best practice to trigger releases only on version tags like v1.0
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug/release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
env:
  GStreamerVersion: 1.26.6 # Using a slightly older, but very stable version for this example. Can be changed back.

jobs:
  Android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for ncipollo/release-action to create a release
    strategy:
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Download and Extract GStreamer
        run: |
          wget https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GStreamerVersion }}/gstreamer-1.0-android-universal-${{ env.GStreamerVersion }}.tar.xz
          mkdir gstreamer_android
          tar -xf gstreamer-1.0-android-universal-${{ env.GStreamerVersion }}.tar.xz -C gstreamer_android/

      - name: Create NDK Project Structure
        run: |
          # The GStreamer build system needs to be included in an Android.mk file.
          # We'll create a minimal project structure for it.
          mkdir -p jni

          # Application.mk tells ndk-build which ABI and platform to build for.
          echo "APP_ABI := ${{ matrix.abi }}" > jni/Application.mk
          echo "APP_PLATFORM := android-21" >> jni/Application.mk
          echo "APP_STL := c++_shared" >> jni/Application.mk

          # Android.mk includes the GStreamer build system.
          echo 'LOCAL_PATH := $(call my-dir)' > jni/Android.mk
          echo 'include $(CLEAR_VARS)' >> jni/Android.mk
          # This is the name of our final, single .so file
          echo 'LOCAL_MODULE := gstreamer_android' >> jni/Android.mk
          # This line is the magic. It tells the NDK to use the GStreamer build rules.
          echo 'GSTREAMER_NDK_BUILD_PATH := $(GSTREAMER_ROOT_ANDROID)/share/gst-android/ndk-build/' >> jni/Android.mk
          echo 'include $(GSTREAMER_NDK_BUILD_PATH)/gstreamer-1.0.mk' >> jni/Android.mk

      - name: Build GStreamer Combined Library
        run: |
          # This environment variable is CRITICAL. It tells the GStreamer build
          # system where to find its own files (headers, libs, pkg-config files).
          export GSTREAMER_ROOT_ANDROID=${{ github.workspace }}/gstreamer_android

          echo "GSTREAMER_ROOT_ANDROID is set to: ${GSTREAMER_ROOT_ANDROID}"
          echo "=== Building libgstreamer_android.so for ${{ matrix.abi }} ==="

          # Run ndk-build. It will automatically find the ./jni directory.
          ndk-build
          
          echo "=== Build complete. Listing output files: ==="
          ls -l libs/${{ matrix.abi }}/

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          # Copy the compiled GStreamer library
          cp libs/${{ matrix.abi }}/libgstreamer_android.so artifacts/
          # Copy the required C++ shared library from the NDK
          cp ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so artifacts/
          
          echo "=== Artifacts prepared: ==="
          ls -l artifacts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGStreamer-${{ matrix.abi }}
          path: artifacts/*.so

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # Only run this step for tags
        uses: ncipollo/release-action@v1
        with:
          # The action automatically finds the tag name from the push event
          artifacts: "artifacts/*.so"
          token: ${{ secrets.GITHUB_TOKEN }}
